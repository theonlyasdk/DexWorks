AutoName: DexWorks
Summary: Inspect APKs on-device: manifest, DEX code, files.
Description: |-
  DexWorks is an on-device package lab. No desktop computer needed.

  Browse installed apps and APK files. See the inside of an app: manifest,
  components, permissions, signatures, resources, and native libraries.

  Extract APKs, splits, and embedded files. Decompile DEX into readable source.
  Disassemble DEX into Smali. Search classes and methods.

